<body>
  <div id="__bundler_placeholder">Loading IDESIE · Home...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:wrap; align-items:stretch; gap:14px\">\n<div style=\"flex:1 1 260px; background:#DCE7FA; border-radius:16px; padding:30px; display:flex; flex-direction:column; gap:10px\"><p style=\"margin:0; font-size:13px; font-weight:700; letter-spacing:1.5px; color:#1F5FD6\">FORMACIÓN<\u002Fp><h3 style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:800; font-size:24px; line-height:1.2; color:#0F2E52\">Competencias<\u002Fh3><p style=\"margin:0; font-size:16px; line-height:1.55; color:#0F2E52\">Microcredenciales y másteres de IDESIE, entidad formativa acreditada por AECOMI.<\u002Fp><\u002Fdiv>\n<div style=\"flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-family:Montserrat, sans-serif; font-weight:800; font-size:44px; color:#1F5FD6; padding:0 4px\" aria-hidden=\"true\">+<\u002Fdiv>\n<div style=\"flex:1 1 260px; background:#DCE7FA; border-radius:16px; padding:30px; display:flex; flex-direction:column; gap:10px\"><p style=\"margin:0; font-size:13px; font-weight:700; letter-spacing:1.5px; color:#1F5FD6\">EXPERIENCIA<\u002Fp><h3 style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:800; font-size:24px; line-height:1.2; color:#0F2E52\">Práctica profesional<\u002Fh3><p style=\"margin:0; font-size:16px; line-height:1.55; color:#0F2E52\">Learning by Working en empresa o el simulador profesional.<\u002Fp><\u002Fdiv>\n<div style=\"flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-family:Montserrat, sans-serif; font-weight:800; font-size:44px; color:#1F5FD6; padding:0 4px\" aria-hidden=\"true\">=<\u002Fdiv>\n<div style=\"flex:1 1 260px; background:#0F2E52; border-radius:16px; padding:30px; display:flex; flex-direction:column; gap:10px\"><p style=\"margin:0; font-size:13px; font-weight:700; letter-spacing:1.5px; color:#F5C232\">META<\u002Fp><h3 style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:800; font-size:24px; line-height:1.2; color:#F4F6F9\">Certificado profesional<\u002Fh3><p style=\"margin:0; font-size:16px; line-height:1.55; color:#F4F6F9\">Tu carnet digital de competencias, emitido por AECOMI.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex; flex-wrap:wrap; gap:16px\">\n<div style=\"flex:1 1 300px; background:#FCFCFD; border:1px solid #DCE2EA; border-radius:16px; padding:26px; display:flex; flex-direction:column; gap:8px\"><h3 style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:700; font-size:18px; color:#0F2E52\">¿Quién me forma?<\u002Fh3><p style=\"margin:0; font-size:16px; line-height:1.55; color:#3A4655\">IDESIE, como entidad formativa acreditada por AECOMI. Profesores que trabajan en las empresas referentes del sector.<\u002Fp><\u002Fdiv>\n<div style=\"flex:1 1 300px; background:#FCFCFD; border:1px solid #DCE2EA; border-radius:16px; padding:26px; display:flex; flex-direction:column; gap:8px\"><h3 style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:700; font-size:18px; color:#0F2E52\">¿Quién me certifica?<\u002Fh3><p style=\"margin:0; font-size:16px; line-height:1.55; color:#3A4655\">AECOMI, entidad independiente que certifica perfiles profesionales del sector AECO. <a href=\"https://www.aecomi.org\" target=\"_blank\" rel=\"noopener\">aecomi.org ↗<\u002Fa><\u002Fp><\u002Fdiv>\n<div style=\"flex:1 1 300px; background:#FCFCFD; border:1px solid #DCE2EA; border-radius:16px; padding:26px; display:flex; flex-direction:column; gap:8px\"><h3 style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:700; font-size:18px; color:#0F2E52\">¿Por qué certificarme?<\u002Fh3><p style=\"margin:0; font-size:16px; line-height:1.55; color:#3A4655\">Porque demuestras a la empresa que tienes las competencias que necesita para el puesto. Y cada vez más concursos y proyectos lo exigen.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section id=\"simulador\" style=\"background:#0F2E52; color:#F4F6F9\">\n<div style=\"max-width:1280px; margin:0 auto; padding:104px 32px; display:flex; flex-direction:column; gap:40px\">\n<div style=\"display:flex; flex-direction:column; gap:14px; max-width:900px\">\n<p style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:700; font-size:14px; letter-spacing:2.5px; text-transform:uppercase; color:#F5C232\">Novedad · Simulador profesional · Para jóvenes talentos<\u002Fp>\n<h2 style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:800; font-size:40px; line-height:1.15; color:#F4F6F9\">Tu primera experiencia profesional, antes de tu primer contrato.<\u002Fh2>\n\n<\u002Fdiv>\n<div style=\"display:flex; flex-wrap:wrap; gap:20px\">\n<div style=\"flex:1 1 420px; background:#173F6B; border-radius:16px; padding:32px; display:flex; flex-direction:column; gap:10px\"><p style=\"margin:0; font-size:13px; font-weight:700; letter-spacing:1.5px; color:#F5C232\">EL PROBLEMA<\u002Fp><p style=\"margin:0; font-size:19px; line-height:1.6; color:#F4F6F9\">Sin experiencia no te contratan. Y sin contrato no consigues experiencia. Muchos jóvenes con talento se quedan atrapados en ese círculo.<\u002Fp><\u002Fdiv>\n<div style=\"flex:1 1 420px; background:#F5C232; color:#0F2E52; border-radius:16px; padding:32px; display:flex; flex-direction:column; gap:10px\"><p style=\"margin:0; font-size:13px; font-weight:700; letter-spacing:1.5px\">LA SOLUCIÓN<\u002Fp><p style=\"margin:0; font-size:19px; line-height:1.6\">Varias empresas se unen para desarrollar contigo un proyecto completo, con todos sus procesos. Es el proyecto fin de máster, y una experiencia diseñada para convalidarse en la certificación.*<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex; flex-wrap:wrap; gap:12px\">\n<div style=\"flex:1 1 150px; background:#173F6B; border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:6px\"><p style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:800; font-size:15px; color:#F5C232\">01<\u002Fp><p style=\"margin:0; font-weight:700; font-size:16px; line-height:1.35\">Requisitos del cliente<\u002Fp><\u002Fdiv>\n<div style=\"flex:1 1 150px; background:#173F6B; border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:6px\"><p style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:800; font-size:15px; color:#F5C232\">02<\u002Fp><p style=\"margin:0; font-weight:700; font-size:16px; line-height:1.35\">Plan de ejecución BIM<\u002Fp><\u002Fdiv>\n<div style=\"flex:1 1 150px; background:#173F6B; border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:6px\"><p style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:800; font-size:15px; color:#F5C232\">03<\u002Fp><p style=\"margin:0; font-weight:700; font-size:16px; line-height:1.35\">Entregas a cliente<\u002Fp><\u002Fdiv>\n<div style=\"flex:1 1 150px; background:#173F6B; border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:6px\"><p style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:800; font-size:15px; color:#F5C232\">04<\u002Fp><p style=\"margin:0; font-weight:700; font-size:16px; line-height:1.35\">Seguimiento y control<\u002Fp><\u002Fdiv>\n<div style=\"flex:1 1 150px; background:#173F6B; border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:6px\"><p style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:800; font-size:15px; color:#F5C232\">05<\u002Fp><p style=\"margin:0; font-weight:700; font-size:16px; line-height:1.35\">Cambios e incidencias<\u002Fp><\u002Fdiv>\n<div style=\"flex:1 1 150px; background:#173F6B; border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:6px\"><p style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:800; font-size:15px; color:#F5C232\">06<\u002Fp><p style=\"margin:0; font-weight:700; font-size:16px; line-height:1.35\">Auditoría<\u002Fp><\u002Fdiv>\n<div style=\"flex:1 1 150px; background:#173F6B; border-radius:12px; padding:16px; display:flex; flex-direction:column; gap:6px\"><p style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:800; font-size:15px; color:#F5C232\">07<\u002Fp><p style=\"margin:0; font-weight:700; font-size:16px; line-height:1.35\">Entrega final y defensa<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex; flex-wrap:wrap; gap:20px; align-items:center; justify-content:space-between\">\n<p style=\"margin:0; font-size:14px; color:#C9D6E6; max-width:640px\">* Según los criterios del esquema de certificación de AECOMI para cada perfil.<\u002Fp>\n<a href=\"#contacto\" style=\"background:#F5C232; color:#0F2E52; text-decoration:none; font-weight:700; padding:15px 26px; border-radius:8px; font-size:17px\">Quiero participar<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section id=\"para-ti\" style=\"max-width:1280px; margin:0 auto; padding:104px 32px; display:flex; flex-direction:column; gap:32px\">\n<div style=\"display:flex; flex-direction:column; gap:14px; max-width:820px\">\n<p style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:700; font-size:14px; letter-spacing:2.5px; text-transform:uppercase; color:#1F5FD6\">Formación adaptada a ti<\u002Fp>\n<h2 style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:800; font-size:40px; line-height:1.15; color:#0F2E52\">¿En qué momento profesional estás?<\u002Fh2>\n<p style=\"margin:0; font-size:19px; line-height:1.6; color:#3A4655\">Elige tu situación y te mostramos los programas pensados para ti.<\u002Fp>\n<\u002Fdiv>\n<div role=\"tablist\" aria-label=\"Situación profesional\" style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:12px\">\n<sc-for list=\"{{aud}}\" as=\"u\" hint-placeholder-count=\"4\">\n<button role=\"tab\" aria-selected=\"{{u.selected}}\" sc-camel-on-click=\"{{u.pick}}\" style=\"{{u.style}}\"><span style=\"display:block; font-family:Montserrat, sans-serif; font-weight:800; font-size:17px; line-height:1.25\">{{u.t}}<\u002Fspan><span style=\"display:block; font-size:14px; line-height:1.45; margin-top:6px; opacity:0.85\">{{u.s}}<\u002Fspan><\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"background:#FCFCFD; border:1px solid #DCE2EA; border-radius:16px; padding:36px; display:flex; flex-direction:column; gap:20px\">\n<p style=\"margin:0; font-size:18px; line-height:1.55; color:#3A4655\">{{curAud.d}}<\u002Fp>\n<div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:16px\">\n<sc-for list=\"{{curAud.recs}}\" as=\"r\" hint-placeholder-count=\"3\">\n<a href=\"{{r.href}}\" style=\"text-decoration:none; background:#F4F6F9; border:1px solid #DCE2EA; border-radius:12px; padding:22px; display:flex; flex-direction:column; gap:8px\"><span style=\"font-family:Montserrat, sans-serif; font-weight:800; font-size:19px; color:#0F2E52\">{{r.t}}<\u002Fspan><span style=\"font-size:15px; line-height:1.5; color:#3A4655\">{{r.d}}<\u002Fspan><span style=\"font-weight:700; font-size:15px; color:#1F5FD6\">Ver más →<\u002Fspan><\u002Fa>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section id=\"perfiles\" style=\"background:#FCFCFD; border-top:1px solid #DCE2EA; border-bottom:1px solid #DCE2EA\">\n<div style=\"max-width:1280px; margin:0 auto; padding:96px 32px; display:flex; flex-direction:column; gap:28px\">\n<div style=\"display:flex; flex-direction:column; gap:12px; max-width:800px\">\n<p style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:700; font-size:14px; letter-spacing:2.5px; text-transform:uppercase; color:#1F5FD6\">Perfiles profesionales<\u002Fp>\n<h2 style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:800; font-size:40px; line-height:1.15; color:#0F2E52\">¿Qué perfil quieres alcanzar?<\u002Fh2>\n<p style=\"margin:0; font-size:19px; line-height:1.55; color:#3A4655\">Cada perfil tiene su mapa de competencias. Sabrás qué microcredenciales necesitas y cuánto te falta para llegar. Al completarlo, obtienes la certificación universitaria del perfil.<\u002Fp>\n<\u002Fdiv>\n<div role=\"tablist\" aria-label=\"Perfiles\" style=\"display:flex; flex-wrap:wrap; gap:10px\">\n<sc-for list=\"{{profiles}}\" as=\"p\" hint-placeholder-count=\"7\">\n<button role=\"tab\" aria-selected=\"{{p.selected}}\" sc-camel-on-click=\"{{p.pick}}\" style=\"{{p.tabStyle}}\">{{p.name}}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"background:#F4F6F9; border:1px solid #DCE2EA; border-radius:16px; padding:36px; display:flex; flex-wrap:wrap; gap:44px\">\n<div style=\"flex:1 1 340px; display:flex; flex-direction:column; gap:16px\">\n<span style=\"{{cur.badgeStyle}}\">{{cur.badge}}<\u002Fspan>\n<h3 style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:800; font-size:30px; color:#0F2E52\">{{cur.name}}<\u002Fh3>\n<p style=\"margin:0; font-size:18px; line-height:1.55; color:#3A4655\">{{cur.desc}}<\u002Fp>\n<div style=\"display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:10px\">\n<div style=\"background:#FCFCFD; border-radius:10px; padding:14px\"><p style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:800; font-size:24px; color:#0F2E52\">{{cur.count}}<\u002Fp><p style=\"margin:2px 0 0; font-size:14px; color:#55606E\">microcredenciales<\u002Fp><\u002Fdiv>\n<div style=\"background:#FCFCFD; border-radius:10px; padding:14px\"><p style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:800; font-size:24px; color:#0F2E52\">{{cur.ects}}<\u002Fp><p style=\"margin:2px 0 0; font-size:14px; color:#55606E\">ECTS<\u002Fp><\u002Fdiv>\n<div style=\"background:#FCFCFD; border-radius:10px; padding:14px\"><p style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:800; font-size:24px; color:#0F2E52\">{{cur.price}}<\u002Fp><p style=\"margin:2px 0 0; font-size:14px; color:#55606E\">módulo a módulo<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex; align-items:center; gap:10px; background:#DCE7FA; border-radius:10px; padding:12px 14px\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#1F5FD6\" stroke-width=\"2\" aria-hidden=\"true\"><path d=\"M3 9l9-5 9 5-9 5-9-5z\"><\u002Fpath><path d=\"M7 11v5c0 1 2.5 3 5 3s5-2 5-3v-5\"><\u002Fpath><\u002Fsvg><span style=\"font-size:15px; font-weight:700; color:#0F2E52\">Certificación universitaria UTAMED al completar el mapa del perfil<\u002Fspan><\u002Fdiv>\n<p style=\"margin:0; font-size:16px; line-height:1.5; color:#0F2E52; font-weight:600\">{{cur.expText}} <a href=\"https://www.aecomi.org\" target=\"_blank\" rel=\"noopener\" style=\"{{cur.certLink}}\">Ir a AECOMI ↗<\u002Fa><\u002Fp>\n<a href=\"Perfil.dc.html\" style=\"align-self:flex-start; background:#1F5FD6; color:#FCFCFD; text-decoration:none; font-weight:700; padding:14px 24px; border-radius:8px; font-size:17px\">Ver el mapa completo<\u002Fa>\n<\u002Fdiv>\n<div style=\"flex:1.4 1 460px; display:flex; flex-direction:column; gap:12px\">\n<p style=\"margin:0; font-size:14px; font-weight:700; letter-spacing:1.5px; color:#55606E\">MAPA DE COMPETENCIAS · MICROCREDENCIALES<\u002Fp>\n<div style=\"display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:8px\">\n<sc-for list=\"{{cur.micros}}\" as=\"m\" hint-placeholder-count=\"14\">\n<div style=\"display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid #DCE2EA; border-radius:8px; background:#FCFCFD\">\n<span style=\"font-family:Montserrat, sans-serif; font-weight:800; font-size:14px; color:#1F5FD6; width:22px\">{{m.c}}<\u002Fspan>\n<span style=\"flex:1; font-size:15px; font-weight:600; line-height:1.3; color:#16212E\">{{m.t}}<\u002Fspan>\n<span style=\"font-size:13px; font-weight:700; color:#55606E; white-space:nowrap\">{{m.e}} ECTS<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section id=\"programas\" style=\"background:#FCFCFD; border-top:1px solid #DCE2EA; border-bottom:1px solid #DCE2EA\">\n<div style=\"max-width:1280px; margin:0 auto; padding:104px 32px; display:flex; flex-direction:column; gap:32px\">\n<div style=\"display:flex; flex-direction:column; gap:14px; max-width:820px\">\n<p style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:700; font-size:14px; letter-spacing:2.5px; text-transform:uppercase; color:#1F5FD6\">Programas<\u002Fp>\n<h2 style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:800; font-size:40px; line-height:1.15; color:#0F2E52\">Másteres, microcredenciales y perfiles profesionales<\u002Fh2>\n<p style=\"margin:0; font-size:19px; line-height:1.6; color:#3A4655\">Todos con certificación universitaria de UTAMED y alineados con los perfiles que certifica AECOMI.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:flex; flex-wrap:wrap; gap:20px\">\n<div style=\"flex:1 1 300px; background:#FCFCFD; border:1px solid #DCE2EA; border-radius:16px; padding:30px; display:flex; flex-direction:column; gap:4px\"><h3 style=\"margin:0; padding-bottom:12px; border-bottom:1px solid #DCE2EA; font-family:Montserrat, sans-serif; font-weight:800; font-size:24px; color:#0F2E52\">Masters<\u002Fh3><p style=\"margin:14px 0 6px; font-family:Montserrat, sans-serif; font-weight:700; font-size:15px; color:#1F5FD6\">Programas Presenciales<\u002Fp><p style=\"margin:0; padding:5px 0; font-weight:600; font-size:16px; color:#16212E\">&gt; MBIM<\u002Fp><p style=\"margin:0; padding:5px 0; font-weight:600; font-size:16px; color:#16212E\">&gt; MBBE<\u002Fp><p style=\"margin:14px 0 6px; font-family:Montserrat, sans-serif; font-weight:700; font-size:15px; color:#1F5FD6\">Programas Online<\u002Fp><p style=\"margin:0; padding:5px 0; font-weight:600; font-size:16px; color:#16212E\">&gt; MBIM<\u002Fp><p style=\"margin:0; padding:5px 0; font-weight:600; font-size:16px; color:#16212E\">&gt; MBBE<\u002Fp><p style=\"margin:auto 0 0; padding-top:16px; font-size:15px; font-weight:700; color:#1F5FD6\">Máster BIM online · 4.800 €<\u002Fp><\u002Fdiv>\n<div style=\"flex:1 1 300px; background:#FCFCFD; border:1px solid #DCE2EA; border-radius:16px; padding:30px; display:flex; flex-direction:column; gap:4px\"><h3 style=\"margin:0; padding-bottom:12px; border-bottom:1px solid #DCE2EA; font-family:Montserrat, sans-serif; font-weight:800; font-size:24px; color:#0F2E52\">Microcredenciales<\u002Fh3><p style=\"margin:14px 0 6px; font-family:Montserrat, sans-serif; font-weight:700; font-size:15px; color:#1F5FD6\">Áreas:<\u002Fp><p style=\"margin:0; padding:5px 0; font-weight:600; font-size:16px; color:#16212E\">&gt; Ingeniería<\u002Fp><p style=\"margin:0; padding:5px 0; font-weight:600; font-size:16px; color:#16212E\">&gt; Arquitectura<\u002Fp><p style=\"margin:0; padding:5px 0; font-weight:600; font-size:16px; color:#16212E\">&gt; Construcción<\u002Fp><p style=\"margin:0; padding:5px 0; font-weight:600; font-size:16px; color:#16212E\">&gt; Gestión de Proyectos<\u002Fp><p style=\"margin:0; padding:5px 0; font-weight:600; font-size:16px; color:#16212E\">&gt; Operación y Mantenimiento<\u002Fp><p style=\"margin:auto 0 0; padding-top:16px; font-size:15px; font-weight:700; color:#1F5FD6\">Desde 96 € · 96 € por ECTS<\u002Fp><\u002Fdiv>\n<div style=\"flex:1 1 300px; background:#FCFCFD; border:1px solid #DCE2EA; border-radius:16px; padding:30px; display:flex; flex-direction:column; gap:4px\"><h3 style=\"margin:0; padding-bottom:12px; border-bottom:1px solid #DCE2EA; font-family:Montserrat, sans-serif; font-weight:800; font-size:24px; color:#0F2E52\">Perfiles profesionales<\u002Fh3><p style=\"margin:14px 0 6px; font-family:Montserrat, sans-serif; font-weight:700; font-size:15px; color:#1F5FD6\">Certificables AECOMI:<\u002Fp><p style=\"margin:0; padding:5px 0; font-weight:600; font-size:16px; color:#16212E\">&gt; BIM Design Manager<\u002Fp><p style=\"margin:0; padding:5px 0; font-weight:600; font-size:16px; color:#16212E\">&gt; BIM Construction Manager<\u002Fp><p style=\"margin:0; padding:5px 0; font-weight:600; font-size:16px; color:#16212E\">&gt; Information Delivery Manager<\u002Fp><p style=\"margin:14px 0 6px; font-family:Montserrat, sans-serif; font-weight:700; font-size:15px; color:#1F5FD6\">Itinerarios formativos:<\u002Fp><p style=\"margin:0; padding:5px 0; font-weight:600; font-size:16px; color:#16212E\">&gt; BIM Modeler<\u002Fp><p style=\"margin:0; padding:5px 0; font-weight:600; font-size:16px; color:#16212E\">&gt; BIM Coordinator<\u002Fp><p style=\"margin:0; padding:5px 0; font-weight:600; font-size:16px; color:#16212E\">&gt; BIM Facility Manager<\u002Fp><p style=\"margin:0; padding:5px 0; font-weight:600; font-size:16px; color:#16212E\">&gt; BIM Manager<\u002Fp><p style=\"margin:auto 0 0; padding-top:16px; font-size:15px; font-weight:700; color:#1F5FD6\">Certificación universitaria UTAMED<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section id=\"metodo\" style=\"max-width:1280px; margin:0 auto; padding:104px 32px; display:flex; flex-wrap:wrap; gap:56px; align-items:center\">\n<div style=\"flex:1 1 460px; display:flex; flex-direction:column; gap:18px\">\n<p style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:700; font-size:14px; letter-spacing:2.5px; text-transform:uppercase; color:#1F5FD6\">Learning by Working · Profesorado<\u002Fp>\n<h2 style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:800; font-size:40px; line-height:1.15; color:#0F2E52\">Aprendes de quien hace el trabajo cada día<\u002Fh2>\n<p style=\"margin:0; font-size:19px; line-height:1.6; color:#3A4655\">Nuestros profesores no son académicos: son profesionales de empresas referentes del sector AECO, expertos en lo que enseñan. En los másteres presenciales trabajas en empresa desde el primer día.<\u002Fp>\n<p style=\"margin:0; font-size:17px; line-height:1.6; color:#3A4655\">Formamos grandes profesionales: la mejor formación técnica, reforzada en gestión y comunicación, con la ética profesional y la sostenibilidad siempre presentes.<\u002Fp>\n<div style=\"display:flex; flex-wrap:wrap; gap:10px\"><span style=\"background:#DCE7FA; color:#0F2E52; font-weight:700; font-size:15px; padding:8px 14px; border-radius:999px\">Excelencia técnica<\u002Fspan><span style=\"background:#DCE7FA; color:#0F2E52; font-weight:700; font-size:15px; padding:8px 14px; border-radius:999px\">Gestión y comunicación<\u002Fspan><span style=\"background:#DCE7FA; color:#0F2E52; font-weight:700; font-size:15px; padding:8px 14px; border-radius:999px\">Ética profesional<\u002Fspan><span style=\"background:#DCE7FA; color:#0F2E52; font-weight:700; font-size:15px; padding:8px 14px; border-radius:999px\">Sostenibilidad<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<img src=\"389c7da6-9371-4c50-b917-158feda4e643\" alt=\"Clase práctica en IDESIE con un profesor del sector\" style=\"flex:1 1 460px; min-width:0; width:100%; height:420px; object-fit:cover; border-radius:16px\">\n<\u002Fsection>\n<section id=\"alumni\" style=\"background:#FCFCFD; border-top:1px solid #DCE2EA; border-bottom:1px solid #DCE2EA\">\n<div style=\"max-width:1280px; margin:0 auto; padding:104px 32px; display:flex; flex-direction:column; gap:32px\">\n<div style=\"display:flex; flex-direction:column; gap:14px; max-width:820px\">\n<p style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:700; font-size:14px; letter-spacing:2.5px; text-transform:uppercase; color:#1F5FD6\">Alumni<\u002Fp>\n<h2 style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:800; font-size:40px; line-height:1.15; color:#0F2E52\">Dónde están hoy nuestros alumnos<\u002Fh2>\n<p style=\"margin:0; font-size:19px; line-height:1.6; color:#3A4655\">El éxito de nuestros alumnos es nuestro éxito.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:16px\"><div style=\"background:#FCFCFD; border:1px solid #DCE2EA; border-radius:16px; padding:26px; display:flex; flex-direction:column; gap:12px\"><span style=\"width:56px; height:56px; border-radius:999px; background:#0F2E52; color:#F5C232; display:flex; align-items:center; justify-content:center; font-family:Montserrat, sans-serif; font-weight:800; font-size:18px\">IA<\u002Fspan><h3 style=\"margin:0; font-family:Montserrat, sans-serif; font-w if; font-weight:800; font-size:18px\">JL<\u002Fspan><h3 style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:800; font-size:19px; color:#0F2E52\">Javier López<\u002Fh3><p style=\"margin:0; font-size:16px; font-weight:600; color:#16212E\">Senior Digital Construction Manager<\u002Fp><p style=\"margin:0; font-size:15px; color:#55606E\">Sir Robert McAlpine · Londres<\u002Fp><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section id=\"alianzas\" style=\"max-width:1280px; margin:0 auto; padding:104px 32px; display:flex; flex-direction:column; gap:32px\">\n<div style=\"display:flex; flex-direction:column; gap:14px; max-width:820px\">\n<p style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:700; font-size:14px; letter-spacing:2.5px; text-transform:uppercase; color:#1F5FD6\">Alianzas estratégicas<\u002Fp>\n<h2 style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:800; font-size:40px; line-height:1.15; color:#0F2E52\">Respaldo académico y profesional a ambos lados del Atlántico<\u002Fh2>\n\n<\u002Fdiv>\n<div style=\"display:flex; flex-wrap:wrap; gap:20px\">\n<div style=\"flex:1 1 300px; background:#FCFCFD; border:1px solid #DCE2EA; border-radius:16px; border-radius:16px; padding:32px; display:flex; flex-direction:column; gap:10px\"><p style=\"margin:0; font-size:13px; font-weight:700; letter-spacing:1.5px; color:#1F5FD6\">CERTIFICACIÓN UNIVERSITARIA<\u002Fp><h3 style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:800; font-size:24px; color:#0F2E52\">UTAMED<\u002Fh3><p style=\"margin:0; font-size:14px; font-weight:700; color:#3A4655\">España<\u002Fp><p style=\"margin:0; font-size:16px; line-height:1.55; color:#3A4655\">Universidad Tecnológica Atlántico-Mediterráneo. Certifica nuestros másteres, microcredenciales y perfiles profesionales.<\u002Fp><\u002Fdiv>\n<div style=\"flex:1 1 300px; background:#FCFCFD; border:1px solid #DCE2EA; border-radius:16px; border-radius:16px; padding:32px; display:flex; flex-direction:column; gap:10px\"><p style=\"margin:0; font-size:13px; font-weight:700; letter-spacing:1.5px; color:#1F5FD6\">ALIANZA ACADÉMICA<\u002Fp><h3 style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:800; font-size:24px; color:#0F2E52\">Universidad Panamericana<\u002Fh3><p style=\"margin:0; font-size:14px; font-weight:700; color:#3A4655\">México<\u002Fp><p style=\"margin:0; font-size:16px; line-height:1.55; color:#3A4655\">[Alcance del convenio con la Universidad Panamericana].<\u002Fp><\u002Fdiv>\n<div style=\"flex:1 1 300px; background:#0F2E52; color:#F4F6F9; border-radius:16px; padding:32px; display:flex; flex-direction:column; gap:10px\"><p style=\"margin:0; font-size:13px; font-weight:700; letter-spacing:1.5px; color:#F5C232\">CERTIFICACIÓN PROFESIONAL<\u002Fp><h3 style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:800; font-size:24px; color:#F4F6F9\">AECOMI<\u002Fh3><p style=\"margin:0; font-size:14px; font-weight:700; color:#C9D6E6\">Internacional<\u002Fp><p style=\"margin:0; font-size:16px; line-height:1.55; color:#C9D6E6\">Certifica de forma independiente los perfiles profesionales del sector AECO.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<section id=\"empresas\" style=\"background:#FCFCFD; border-top:1px solid #DCE2EA\">\n<div style=\"max-width:1280px; margin:0 auto; padding:104px 32px; display:flex; flex-direction:column; gap:28px\">\n<div style=\"display:flex; flex-direction:column; gap:14px; max-width:820px\">\n<p style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:700; font-size:14px; letter-spacing:2.5px; text-transform:uppercase; color:#1F5FD6\">Empresas<\u002Fp>\n<h2 style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:800; font-size:40px; line-height:1.15; color:#0F2E52\">Las empresas referentes del sector confían en nosotros<\u002Fh2>\n\n<\u002Fdiv>\n<p style=\"margin:0; font-family:Montserrat, sans-serif; font-weight:700; font-size:20px; line-height:1.75; color:#0F2E52\">L35 Arquitectos · Estudi
